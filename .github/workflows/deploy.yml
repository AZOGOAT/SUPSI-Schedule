name: Deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: Scrape again even if SUPSI's update time has not changed
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Scrape the timetable
        id: scrape
        run: |
          result=$(pnpm --silent scrape ${{ inputs.force && '--force' || '' }} | tail -n 1)
          echo "result=$result" >> "$GITHUB_OUTPUT"
          echo "scrape: $result"

      - name: Commit the new data
        if: steps.scrape.outputs.result == 'changed'
        run: |
          source=$(node -p "require('./public/data/timetable.json').sourceUpdatedAt.replace('T', ' ')")
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/timetable.json
          git commit -m "data: update timetable (source $source)"
          git pull --rebase
          git push

      - name: Check and build
        if: github.event_name != 'schedule' || steps.scrape.outputs.result == 'changed'
        run: |
          pnpm lint
          pnpm typecheck
          pnpm test
          pnpm build

      - name: Deploy to Cloudflare Pages
        if: github.event_name != 'schedule' || steps.scrape.outputs.result == 'changed'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=supsi-schedule --branch=main
